{% extends "admin/base.html" %}
{% block footer %}{% endblock %}
{% block admin %}
<div class="narrow" style="max-width: 420px; margin: 0 auto;">
  <div class="panel">
    <h1>Organizer login</h1>
    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field"><span>Username</span><input name="username" required autocomplete="username" autofocus></label>
      <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-green btn-lg" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
